[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flavour-pvm"
version = "1.0.2"
authors = [
  { name="Sanjoy Deb", email="sanjoydeb404@gmail.com" },
]
description = "A custom vernacular Python dialect powered by a stack-based Mini-PVM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
flavour = "flavour:main"

[tool.setuptools]
py-modules = ["flavour", "dialects"]
packages = ["pvm"]
